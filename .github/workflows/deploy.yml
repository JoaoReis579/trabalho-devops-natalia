name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -R images _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notificar falha no Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::O secret DISCORD_WEBHOOK não está configurado."
            exit 1
          fi
          payload=$(jq -n --arg content "Falha na publicação do site.\nRepositório: $REPOSITORY\nBranch: $BRANCH\nCommit: $COMMIT\nExecução: $RUN_URL" '{content: $content}')
          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK"
